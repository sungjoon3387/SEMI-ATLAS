<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semi Atlas</title>
<meta name="theme-color" content="#0B1621">
<link rel="manifest" href='data:application/manifest+json,{"name":"Semi Atlas","short_name":"Semi","display":"standalone","theme_color":"%230B1621","background_color":"%230B1621","start_url":"./index.html"}'>
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%230B1621"/><g stroke="%2345C4B0" stroke-width="6" fill="none"><path d="M18 70h64M18 54h64M18 38h64"/></g><circle cx="50" cy="24" r="9" fill="%23E09E4A"/></svg>'>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0B1621; --panel:#101E2B; --panel2:#152838; --line:#1D3243;
  --ink:#E6EEF4; --mid:#B4C7D6; --dim:#7E99AC;
  --teal:#45C4B0; --violet:#9B8CF0; --brass:#E09E4A; --rose:#E8697D;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Segoe UI','Noto Sans KR',sans-serif;
  font-size:15px; line-height:1.62; font-weight:350;
  font-variant-numeric:tabular-nums;
  padding-bottom:56px;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}

/* ── 상단 ── */
header{
  position:sticky; top:0; z-index:20; background:rgba(11,22,33,.94);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  padding:env(safe-area-inset-top) 0 0;
}
.brandbar{display:flex;align-items:baseline;gap:10px;padding:12px 18px 8px}
.brand{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--teal)}
.stamp{font-size:12px;color:var(--dim);margin-left:auto}
nav{display:flex;gap:2px;padding:0 12px 0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none;border:0;color:var(--dim);font:inherit;font-size:14.5px;
  padding:9px 12px 11px;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:color .15s;
}
nav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--teal)}

main{max-width:760px;margin:0 auto;padding:18px}
section[hidden]{display:none}
h2{font-size:13px;font-weight:600;color:var(--dim);margin:26px 0 10px;letter-spacing:.02em}
h2:first-child{margin-top:0}
h3{font-size:16.5px;font-weight:600;margin:0 0 3px}

/* ── 히어로 (뉴스) ── */
.hero{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:4px}
.hero .today{font-size:12.5px;color:var(--dim)}
.hero .lead{font-size:26px;font-weight:700;line-height:1.32;letter-spacing:-.02em;margin:6px 0 2px}
.hero .lead a:hover{color:var(--teal)}
.hero .meta{font-size:12.5px;color:var(--dim);margin-top:6px}
.pin{margin-top:14px;display:grid;gap:9px}
.pin a{display:block;font-size:14.5px;line-height:1.45;color:var(--mid);padding-left:12px;border-left:2px solid var(--line)}
.pin a:hover{color:var(--ink);border-left-color:var(--brass)}

/* ── 필터 ── */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 14px}
.chips button{
  background:var(--panel);border:1px solid var(--line);color:var(--dim);
  font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer;
}
.chips button[aria-pressed="true"]{background:var(--panel2);border-color:var(--teal);color:var(--ink)}

/* ── 뉴스 목록 ── */
.day{font-size:12px;color:var(--dim);margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.item{display:block;padding:11px 0 12px 13px;border-left:2px solid var(--line)}
.item+.item{border-top:1px solid rgba(29,50,67,.5)}
.item:hover .t{color:var(--teal)}
.item .t{font-size:15.5px;font-weight:500;line-height:1.45}
.item .s{font-size:12.5px;color:var(--dim);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.item[data-c="foundry"]{border-left-color:var(--brass)}
.item[data-c="pkg"]{border-left-color:var(--violet)}
.item[data-c="memory"]{border-left-color:var(--teal)}
.item[data-c="equip"]{border-left-color:#5B8FC7}
.tag{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.sam{color:var(--brass)}

/* ── 카드 ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:11px}
.card.cu{border-left:3px solid var(--brass)}
.card.teal{border-left:3px solid var(--teal)}
.card.violet{border-left:3px solid var(--violet)}
.card.dim{border-left:3px solid var(--line)}
.card .role{font-size:13px;color:var(--dim);margin-bottom:9px}
.hotmark{font-size:11px;color:var(--brass);border:1px solid rgba(224,158,74,.4);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}

/* ── 정의 목록 ── */
dl{display:grid;grid-template-columns:minmax(84px,auto) 1fr;gap:7px 14px;font-size:14px}
dt{color:var(--mid);font-weight:500}
dd{color:var(--dim);line-height:1.55}
@media(max-width:430px){dl{grid-template-columns:1fr;gap:1px 0}dl dd{margin-bottom:9px}}

/* ── 단계 ── */
.steps{counter-reset:s;display:grid;gap:0}
.steps li{list-style:none;counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid rgba(29,50,67,.6)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);color:var(--teal);font-size:12px;font-weight:600;padding-top:3px}
.steps b{font-weight:600;font-size:14.5px}
.steps span{display:block;color:var(--dim);font-size:13.5px;line-height:1.5}

/* ── 지표 ── */
.ind{display:block;border-top:1px solid var(--line);padding:11px 0}
.ind:first-of-type{border-top:0}
.ind .n{font-size:14.5px;font-weight:500}
.ind .n:hover{color:var(--teal)}
.ind .c{font-size:12.5px;color:var(--brass);margin-left:8px;font-weight:400}
.ind .d{font-size:13px;color:var(--dim)}

/* ── 추이 ── */
.trend{display:flex;align-items:flex-end;gap:3px;height:74px;margin:6px 0 4px}
.trend div{flex:1;background:var(--panel2);border-radius:2px 2px 0 0;min-height:2px;position:relative}
.trend div span{position:absolute;inset:auto 0 -18px;text-align:center;font-size:9.5px;color:var(--dim)}
.lead{color:var(--dim);font-size:13.5px;margin-bottom:12px;max-width:62ch}
.note{font-size:12.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px;margin-top:22px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--dim);font-size:14px}
.empty code{color:var(--teal);background:var(--panel2);padding:2px 7px;border-radius:5px}
.you{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.you .p{font-size:13.5px;color:var(--mid);line-height:1.7}
.you .p i{font-style:normal;color:var(--dim);padding:0 6px}
.you .p b{color:var(--brass);font-weight:600}
/* ── 그림 ── */
.fig{margin:2px 0 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 10px}
.fig svg{display:block}
.cap{font-size:12px;color:var(--dim);line-height:1.5;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}

/* ── 용어 링크 ── */
.term{
  background:none;border:0;padding:0;font:inherit;color:var(--teal);cursor:pointer;
  border-bottom:1px dotted rgba(69,196,176,.55);line-height:inherit;
}
.term:hover{border-bottom-style:solid}

/* ── 하단 시트 ── */
.bd{position:fixed;inset:0;background:rgba(4,10,16,.66);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.bd.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:82vh;overflow-y:auto;
  background:var(--panel);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:20px 20px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
}
.sheet.on{transform:none}
@media(min-width:720px){.sheet{max-width:560px;margin:0 auto;border-radius:16px;bottom:24px;border:1px solid var(--line)}}
.sheet .grab{width:34px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 14px}
.sheet .ab{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sheet .fn{font-size:14px;color:var(--teal);margin-top:2px}
.sheet .kr{font-size:13px;color:var(--dim);margin-top:1px}
.sheet h4{font-size:11.5px;color:var(--dim);font-weight:600;margin:18px 0 5px;letter-spacing:.03em}
.sheet p{font-size:14.5px;line-height:1.66;color:var(--mid)}
.sheet .rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sheet .rel .term{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px}
.sheet .cl{position:absolute;top:16px;right:18px;background:none;border:0;color:var(--dim);font-size:22px;cursor:pointer;line-height:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brandbar">
    <span class="brand">Semi <em>Atlas</em></span>
    <span class="stamp" id="stamp">—</span>
  </div>
  <nav id="nav" role="tablist">
    <button role="tab" data-p="news" aria-selected="true">뉴스</button>
    <button role="tab" data-p="samsung" aria-selected="false">삼성 제품군</button>
    <button role="tab" data-p="basics" aria-selected="false">반도체 개요</button>
    <button role="tab" data-p="market" aria-selected="false">업황</button>
  </nav>
</header>

<main>
  <section id="p-news"></section>
  <section id="p-samsung" hidden></section>
  <section id="p-basics" hidden></section>
  <section id="p-market" hidden></section>
</main>

<script src="glossary.js"></script>
<script src="content.js"></script>
<script src="data/news.js" onerror="window.NEWS=null"></script>
<script>
const A = window.ATLAS, N = window.NEWS || null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATLABEL = Object.fromEntries((N?.cats || []).map(c => [c.key, c.label]));

/* ───── 용어 자동 링크 ───── */
const G = window.GLOSSARY || {};
const TERMS = Object.keys(G).sort((a, b) => b.length - a.length);
const RX = TERMS.length
  ? new RegExp('(^|[^A-Za-z0-9_-])(' +
      TERMS.map(t => t.replace(/[.*+?^${}()|[\]\\-]/g, '\\$&')).join('|') +
      ')(?![A-Za-z0-9_-])', 'g')
  : null;
const L = s => RX ? s.replace(RX, (m, p, t) => `${p}<button class="term" data-t="${t}">${t}</button>`) : s;
const E = s => L(esc(s));

document.body.insertAdjacentHTML('beforeend',
  '<div class="bd" id="bd"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>');

function openTerm(k){
  const g = G[k]; if (!g) return;
  $('#sheet').innerHTML = `
    <button class="cl" aria-label="닫기">&times;</button>
    <div class="grab"></div>
    <div class="ab">${esc(k)}</div>
    <div class="fn">${esc(g.full)}</div>
    ${g.ko ? `<div class="kr">${esc(g.ko)}</div>` : ''}
    <h4>무엇인가</h4><p>${E(g.desc)}</p>
    ${g.origin ? `<h4>유래</h4><p>${E(g.origin)}</p>` : ''}
    ${g.note ? `<h4>실무에서</h4><p>${E(g.note)}</p>` : ''}
    ${g.see?.length ? `<h4>관련</h4><div class="rel">${g.see.filter(s => G[s])
      .map(s => `<button class="term" data-t="${s}">${s}</button>`).join('')}</div>` : ''}`;
  $('#sheet').classList.add('on');
  $('#bd').classList.add('on');
  $('#sheet').scrollTop = 0;
}
function closeSheet(){ $('#sheet').classList.remove('on'); $('#bd').classList.remove('on'); }

document.addEventListener('click', e => {
  const t = e.target.closest('.term');
  if (t){ openTerm(t.dataset.t); return; }
  if (e.target.closest('.cl') || e.target.id === 'bd') closeSheet();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ───── 뉴스 ───── */
let filter = 'all';

function ymd(x){
  return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');
}
function dayLabel(d){
  if (d === ymd(new Date())) return '오늘';
  if (d === ymd(new Date(Date.now() - 864e5))) return '어제';
  const [, m, dd] = d.split('-');
  return `${+m}월 ${+dd}일`;
}
function match(i){
  if (filter === 'all') return true;
  if (filter === 'samsung') return i.samsung;
  return i.tags.includes(filter);
}

function newsItem(it){
  const c = it.tags[0];
  return `<a class="item" data-c="${c}" href="${esc(it.url)}" target="_blank" rel="noopener">
    <div class="t">${esc(it.title)}</div>
    <div class="s">
      <span class="${it.samsung ? 'sam' : ''}">${esc(it.source || '출처 미상')}</span>
      ${it.tags.map(t => `<span class="tag">${esc(CATLABEL[t] || t)}</span>`).join('')}
    </div></a>`;
}

function renderNews(){
  const el = $('#p-news');
  if (!N || !N.items?.length){
    el.innerHTML = `<div class="empty">아직 수집된 뉴스가 없습니다.<br><br>
      터미널에서 <code>python collect.py</code> 를 실행하면 채워집니다.</div>`;
    return;
  }
  $('#stamp').textContent = N.updated_kr + ' 갱신';

  const sorted = [...N.items].sort((a,b) => b.score - a.score);
  const top = sorted[0];
  const pins = sorted.slice(1, 4);

  const list = N.items.filter(match);
  const days = [...new Set(list.map(i => i.date))];

  el.innerHTML = `
    <div class="hero">
      <div class="today">${dayLabel(N.items[0].date)} · 최근 7일 ${N.count}건 수집</div>
      <div class="lead"><a href="${esc(top.url)}" target="_blank" rel="noopener">${esc(top.title)}</a></div>
      <div class="meta">${esc(top.source)} · ${top.tags.map(t => CATLABEL[t] || t).join(' · ')}</div>
      <div class="pin">${pins.map(p => `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>`).join('')}</div>
    </div>
    <div class="chips" id="chips">
      ${[['all','전체'], ...(N.cats||[]).map(c => [c.key, c.label]), ['samsung','삼성만']]
        .map(([k,l]) => `<button data-f="${k}" aria-pressed="${k===filter}">${l}</button>`).join('')}
    </div>
    ${list.length
      ? days.map(d => `<div class="day">${dayLabel(d)}</div>` +
          list.filter(i => i.date === d).map(newsItem).join('')).join('')
      : `<div class="empty">이 분류에 해당하는 기사가 없습니다.</div>`}
  `;

  $('#chips').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f;
    renderNews();
  };
}

/* ───── 삼성 ───── */
function renderSamsung(){
  const me = A.me;
  $('#p-samsung').innerHTML = `
    <div class="you">
      <div class="p">${me.path.map((s,i) => i === me.path.length-1 ? `<b>${s}</b>` : s).join('<i>›</i>')}</div>
      <div class="p" style="color:var(--dim);font-size:13px">${me.focus} · ${me.nodes}</div>
    </div>
    ${A.samsung.map(d => `
      <h2>${esc(d.div)}</h2>
      <p class="lead">${esc(d.note)}</p>
      ${d.units.map(u => `
        <div class="card ${d.accent}">
          <h3>${esc(u.name)}${u.hot ? '<span class="hotmark">담당 접점</span>' : ''}</h3>
          ${u.role ? `<div class="role">${E(u.role)}</div>` : ''}
          <dl>${u.lines.map(([k,v]) => `<dt>${E(k)}</dt><dd>${E(v)}</dd>`).join('')}</dl>
        </div>`).join('')}
    `).join('')}
    <div class="note">조직·라인업은 공개 자료 기준입니다. 사내 정보는 이 페이지에 넣지 마세요.</div>`;
}

/* ───── 반도체 개요 ───── */
function renderBasics(){
  $('#p-basics').innerHTML = A.basics.map(s => `
    <h2>${E(s.title)}</h2>
    <p class="lead">${E(s.lead)}</p>
    ${s.svg ? `<div class="fig">${s.svg}${s.cap ? `<div class="cap">${E(s.cap)}</div>` : ''}</div>` : ''}
    <div class="card">
      ${s.steps
        ? `<ol class="steps">${s.steps.map(([b,t]) =>
            `<li><div><b>${E(b)}</b><span>${E(t)}</span></div></li>`).join('')}</ol>`
        : `<dl>${s.rows.map(([k,v]) => `<dt>${E(k)}</dt><dd>${E(v)}</dd>`).join('')}</dl>`}
    </div>`).join('');
}

/* ───── 업황 ───── */
function renderMarket(){
  const m = A.market;
  let trend = '';
  if (N?.trend?.length){
    const keys = ['foundry','pkg','memory','equip','market'];
    const tot = N.trend.map(t => keys.reduce((a,k) => a + (t[k]||0), 0));
    const mx = Math.max(1, ...tot);
    trend = `<h2>최근 14일 수집 뉴스량</h2>
      <p class="lead">키워드에 걸린 기사 수입니다. 절대 지표는 아니지만 이슈가 몰리는 날은 눈에 띕니다.</p>
      <div class="card"><div class="trend">${N.trend.map((t,i) => {
        const h = Math.round(tot[i] / mx * 100);
        const d = t.date.slice(8);
        return `<div style="height:${Math.max(2,h)}%;background:${tot[i]?'var(--teal)':'var(--panel2)'};opacity:${tot[i]?.75:1}" title="${t.date}: ${tot[i]}건"><span>${i%2?'':d}</span></div>`;
      }).join('')}</div><div style="height:14px"></div></div>`;
  }

  $('#p-market').innerHTML = `
    <h2>현재 국면</h2>
    <p class="lead">${esc(m.asOf)}</p>
    <div class="card"><dl>${m.snapshot.map(([k,v]) => `<dt>${E(k)}</dt><dd>${E(v)}</dd>`).join('')}</dl></div>
    <p class="lead" style="margin-top:10px">${esc(m.caution)}</p>

    <h2>움직이는 변수</h2>
    <div class="card"><dl>${m.drivers.map(([k,v]) => `<dt>${E(k)}</dt><dd>${E(v)}</dd>`).join('')}</dl></div>

    <h2>사이클의 성격이 다르다</h2>
    <p class="lead">같은 반도체라도 무엇을 봐야 하는지가 다릅니다.</p>
    <div class="card"><dl>${m.cycle.map(([k,v,w]) =>
      `<dt>${E(k)}</dt><dd>${E(v)}<br><span style="color:var(--teal)">볼 것 —</span> ${E(w)}</dd>`).join('')}</dl></div>

    ${trend}

    <h2>직접 확인하는 곳</h2>
    <p class="lead">기사보다 원본이 빠릅니다. 발표 주기를 알면 뉴스를 기다릴 필요가 없습니다.</p>
    <div class="card">${m.indicators.map(([n,c,d,u]) => `
      <a class="ind" href="${esc(u)}" target="_blank" rel="noopener">
        <div class="n">${esc(n)}<span class="c">${esc(c)}</span></div>
        <div class="d">${esc(d)}</div>
      </a>`).join('')}</div>`;
}

/* ───── 탭 ───── */
const rendered = {};
function show(p){
  document.querySelectorAll('main section').forEach(s => s.hidden = (s.id !== 'p-' + p));
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === p));
  if (!rendered[p]){
    ({news:renderNews, samsung:renderSamsung, basics:renderBasics, market:renderMarket})[p]();
    rendered[p] = 1;
  }
  location.hash = p;
  window.scrollTo(0,0);
}
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.p); };
show(['news','samsung','basics','market'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'news');
</script>
</body>
</html>
